<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    MUKBLOG 파비콘.
    탭에서는 16px로 줄어드니 요소를 하나만 둔다 — M 글자 하나.
    히어로의 MUK(흰색) / BLOG(흰→에메랄드 그라디언트) 대비를 그대로 가져왔다.
  -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#09090B"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="2"/>

  <!-- 획을 굵게 잡아야 16px에서 뭉개지지 않는다 -->
  <path d="M14 47 V17 h7.5 L32 33 42.5 17 H50 v30 h-7.5 V30.5 L32 45.5 21.5 30.5 V47 Z" fill="url(#m)"/>
</svg>
