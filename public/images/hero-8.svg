<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg8)"/>

  <!--
    증상 네 개가 전부 같은 뿌리에서 나왔다는 걸 그림으로 보인 것이다.
    위는 서로 무관해 보이는 증상 넷, 아래는 하나의 뿌리.
    선이 전부 한 점으로 모이는 게 이 글의 논지다.
  -->

  <text x="72" y="86" font-size="34" font-weight="800" fill="#E7ECF2">증상 넷, 뿌리 하나</text>
  <text x="72" y="122" font-size="18" fill="#7A8794">서로 아무 관련 없어 보였고 전부 엉뚱한 곳을 의심했다</text>

  <g stroke-width="1.4">
    <rect x="72"  y="180" width="252" height="96" rx="10" fill="#C25450" fill-opacity="0.10" stroke="#C25450" stroke-opacity="0.36"/>
    <rect x="348" y="180" width="252" height="96" rx="10" fill="#C25450" fill-opacity="0.10" stroke="#C25450" stroke-opacity="0.36"/>
    <rect x="624" y="180" width="252" height="96" rx="10" fill="#C25450" fill-opacity="0.10" stroke="#C25450" stroke-opacity="0.36"/>
    <rect x="900" y="180" width="228" height="96" rx="10" fill="#C25450" fill-opacity="0.10" stroke="#C25450" stroke-opacity="0.36"/>
  </g>

  <g font-size="16" font-weight="700" fill="#D98B88" text-anchor="middle">
    <text x="198"  y="216">명령이 안 먹힌다</text>
    <text x="474"  y="216">데이터가 몇 배가 된다</text>
    <text x="750"  y="216">락을 걸었는데 중복</text>
    <text x="1014" y="216">멀쩡한데 끊겼다고</text>
  </g>
  <g font-size="13" fill="#96706E" text-anchor="middle">
    <text x="198"  y="246">현장 버그인 줄 알았다</text>
    <text x="474"  y="246">재시도 로직인 줄 알았다</text>
    <text x="750"  y="246">락 키 설계인 줄 알았다</text>
    <text x="1014" y="246">네트워크인 줄 알았다</text>
  </g>

  <g stroke="#5B6570" stroke-width="1.4" stroke-dasharray="4 5">
    <path d="M198 282  L600 400"/>
    <path d="M474 282  L600 400"/>
    <path d="M750 282  L600 400"/>
    <path d="M1014 282 L600 400"/>
  </g>

  <rect x="300" y="410" width="600" height="94" rx="12"
        fill="#C9A227" fill-opacity="0.12" stroke="#C9A227" stroke-opacity="0.5" stroke-width="2"/>
  <text x="600" y="450" font-size="23" font-weight="800" fill="#E4D08C" text-anchor="middle">서버는 하나라는 가정</text>
  <text x="600" y="482" font-size="15" fill="#B49A52" text-anchor="middle">코드에 문장으로 적혀 있지 않았다</text>

  <text x="72" y="558" font-size="16" fill="#96A2AE">그 가정은 메모리에 맵을 두는 습관, 스케줄러를 다는 습관,</text>
  <text x="72" y="584" font-size="16" fill="#96A2AE">헬스체크 결과를 읽는 습관 속에 흩어져 있었다.</text>
  <text x="72" y="626" font-size="16" font-weight="700" fill="#7BC79E">한쪽만 보고 370개 → 양쪽 다 보니 727개. 관측 방법의 차이였다.</text>
</svg>
