<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!--
    3층 QC. 1층은 자동으로 통과했고(초록), 2층은 내가 눈으로 봐서 통과시켰고(초록),
    3층은 읽어야만 알 수 있어서 물음표다.
    이 글의 논지가 그거다 — 자동 검사가 통과한 지점은 끝이 아니라 눈으로 볼 준비가 된 지점이다.
  -->
  <rect x="562" y="112" width="566" height="88" rx="10"
        fill="#3FA974" fill-opacity="0.16"
        stroke="#3FA974" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="590" y="152" font-size="20" font-weight="700" fill="#7BC79E">1. 정적</text>
  <text x="590" y="180" font-size="16" fill="#5D8C74">pnpm qc · 라우트 · 타이포 · 용어</text>
  <text x="1100" y="164" font-size="22" font-weight="800" fill="#3FA974" text-anchor="end">✓</text>

  <rect x="562" y="216" width="566" height="88" rx="10"
        fill="#3FA974" fill-opacity="0.16"
        stroke="#3FA974" stroke-opacity="0.42" stroke-width="1.5"/>
  <text x="590" y="256" font-size="20" font-weight="700" fill="#7BC79E">2. 렌더</text>
  <text x="590" y="284" font-size="16" fill="#5D8C74">빈 화면 · 숨은 컨트롤 · 상태 분기</text>
  <text x="1100" y="268" font-size="22" font-weight="800" fill="#3FA974" text-anchor="end">✓</text>

  <rect x="562" y="320" width="566" height="88" rx="10"
        fill="#C98A2E" fill-opacity="0.14"
        stroke="#C98A2E" stroke-opacity="0.46" stroke-width="1.5"/>
  <text x="590" y="360" font-size="20" font-weight="700" fill="#D9A855">3. 판단</text>
  <text x="590" y="388" font-size="16" fill="#9E7838">문장끼리의 모순 · 지킬 수 없는 약속</text>
  <text x="1100" y="372" font-size="22" font-weight="800" fill="#C98A2E" text-anchor="end">?</text>

  <rect x="0" y="0" width="6" height="675" fill="#3FA974"/>

  <text x="72" y="270" font-size="104" font-weight="800" letter-spacing="-3" fill="#FFFFFF">Fitter</text>
  <text x="72" y="330" font-size="34" font-weight="600" fill="#3FA974">인테리어 플랫폼</text>

  <line x1="72" y1="382" x2="330" y2="382" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>

  <text x="72" y="436" font-size="24" font-weight="500" fill="#8A939E">개발기 4 · 자동 검사 두세 번, 눈으로 한 시간</text>

  <text x="72" y="619" font-size="19" fill="#5D666F">사진으로 고르고, 사진으로 보여주는 반셀프 인테리어 매칭</text>
</svg>
