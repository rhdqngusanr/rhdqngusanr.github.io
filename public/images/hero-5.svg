<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg5)"/>

  <!--
    이 글의 논지를 그림 하나로 옮긴 것이다.
    왼쪽은 배포 직전 로컬 상태다. 전부 초록이었다.
    오른쪽은 그 상태에서 배포를 눌렀을 때 실제로 난 실패들이다.
    가운데 선이 중요하다 — 왼쪽 검사가 오른쪽을 하나도 예측하지 못했다.
  -->

  <text x="72" y="86" font-size="34" font-weight="800" fill="#E7ECF2">전부 통과한 상태에서 배포를 눌렀다</text>
  <text x="72" y="122" font-size="18" fill="#7A8794">로컬 검사는 자기가 보는 범위 안에서만 통과를 말한다</text>

  <!-- 왼쪽: 로컬 -->
  <text x="72" y="196" font-size="17" font-weight="700" fill="#5D8C74" letter-spacing="1">로컬</text>

  <rect x="72" y="216" width="420" height="66" rx="10"
        fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.40" stroke-width="1.5"/>
  <text x="98" y="248" font-size="19" font-weight="700" fill="#7BC79E">pnpm build</text>
  <text x="98" y="271" font-size="15" fill="#5D8C74">모노레포 전체</text>
  <text x="466" y="257" font-size="21" font-weight="800" fill="#3FA974" text-anchor="end">✓</text>

  <rect x="72" y="296" width="420" height="66" rx="10"
        fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.40" stroke-width="1.5"/>
  <text x="98" y="328" font-size="19" font-weight="700" fill="#7BC79E">pnpm test</text>
  <text x="98" y="351" font-size="15" fill="#5D8C74">203개 · 도메인 68 + API 135</text>
  <text x="466" y="337" font-size="21" font-weight="800" fill="#3FA974" text-anchor="end">✓</text>

  <rect x="72" y="376" width="420" height="66" rx="10"
        fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.40" stroke-width="1.5"/>
  <text x="98" y="408" font-size="19" font-weight="700" fill="#7BC79E">pnpm qc</text>
  <text x="98" y="431" font-size="15" fill="#5D8C74">0 error · 라우트 · 토큰 · 용어</text>
  <text x="466" y="417" font-size="21" font-weight="800" fill="#3FA974" text-anchor="end">✓</text>

  <!-- 가운데 경계 -->
  <line x1="546" y1="196" x2="546" y2="600" stroke="#2A3138" stroke-width="1.5" stroke-dasharray="5 7"/>

  <!-- 오른쪽: 배포 -->
  <text x="600" y="196" font-size="17" font-weight="700" fill="#B4736B" letter-spacing="1">배포 — 여섯 번 실패</text>

  <g font-size="17" fill="#C9A29C">
    <text x="600" y="240">.gitignore 가 소스 폴더를 삼켰다</text>
    <text x="600" y="286">packages 를 안 지어서 import 가 깨졌다</text>
    <text x="600" y="332">prisma generate 가 빌드보다 늦었다</text>
    <text x="600" y="378">플레이스홀더가 검증을 통과했다</text>
    <text x="600" y="424">R2 에 CORS 가 없어 업로드가 막혔다</text>
    <text x="600" y="470">Cloudflare 프록시가 인증서를 막았다</text>
  </g>
  <g font-size="19" font-weight="800" fill="#B4736B" text-anchor="end">
    <text x="1128" y="240">✕</text>
    <text x="1128" y="286">✕</text>
    <text x="1128" y="332">✕</text>
    <text x="1128" y="378">✕</text>
    <text x="1128" y="424">✕</text>
    <text x="1128" y="470">✕</text>
  </g>

  <text x="600" y="546" font-size="18" font-weight="700" fill="#E7ECF2">여섯 개 중 로컬에서 잡을 수 있던 것은 0개다</text>
  <text x="600" y="576" font-size="16" fill="#7A8794">내 PC 에는 있고 저기엔 없거나, 로컬 도구가 관대했다</text>
</svg>
