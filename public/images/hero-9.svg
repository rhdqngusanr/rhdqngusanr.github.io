<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg9)"/>

  <!--
    배포 비대칭을 그린 것이다.
    위는 5분이면 전부 같은 버전이 되는 서버, 아래는 제각각인 클라이언트 1,000대.
    아래쪽 버전 표시가 뒤로 갈수록 흐려지는 건 "모른다"는 뜻이다.
  -->

  <text x="72" y="86" font-size="34" font-weight="800" fill="#E7ECF2">한쪽만 업데이트된다</text>
  <text x="72" y="122" font-size="18" fill="#7A8794">서버 코드 한 줄이 1,000개 해석과 마주친다</text>

  <text x="72" y="196" font-size="17" font-weight="700" fill="#3FA974" letter-spacing="1">서버 — 배포하면 5분</text>
  <g fill="#3FA974" fill-opacity="0.16" stroke="#3FA974" stroke-opacity="0.45" stroke-width="1.4">
    <rect x="72"  y="216" width="180" height="66" rx="9"/>
    <rect x="268" y="216" width="180" height="66" rx="9"/>
    <rect x="464" y="216" width="180" height="66" rx="9"/>
    <rect x="660" y="216" width="180" height="66" rx="9"/>
  </g>
  <g font-size="17" font-weight="700" fill="#7BC79E" text-anchor="middle">
    <text x="162" y="256">v-latest</text>
    <text x="358" y="256">v-latest</text>
    <text x="554" y="256">v-latest</text>
    <text x="750" y="256">v-latest</text>
  </g>
  <text x="876" y="256" font-size="15" fill="#5D8C74">전부 같은 버전</text>

  <path d="M72 322 L1128 322" stroke="#3B4650" stroke-width="1.2" stroke-dasharray="6 6"/>

  <text x="72" y="384" font-size="17" font-weight="700" fill="#C9A227" letter-spacing="1">현장 클라이언트 1,000여 대 — 수동 배치</text>
  <g stroke-width="1.4">
    <rect x="72"  y="404" width="150" height="66" rx="9" fill="#C9A227" fill-opacity="0.16" stroke="#C9A227" stroke-opacity="0.45"/>
    <rect x="238" y="404" width="150" height="66" rx="9" fill="#C9A227" fill-opacity="0.12" stroke="#C9A227" stroke-opacity="0.34"/>
    <rect x="404" y="404" width="150" height="66" rx="9" fill="#C9A227" fill-opacity="0.09" stroke="#C9A227" stroke-opacity="0.26"/>
    <rect x="570" y="404" width="150" height="66" rx="9" fill="#C9A227" fill-opacity="0.07" stroke="#C9A227" stroke-opacity="0.20"/>
    <rect x="736" y="404" width="150" height="66" rx="9" fill="#C9A227" fill-opacity="0.05" stroke="#C9A227" stroke-opacity="0.15"/>
    <rect x="902" y="404" width="150" height="66" rx="9" fill="#C9A227" fill-opacity="0.04" stroke="#C9A227" stroke-opacity="0.12"/>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="147"  y="444" fill="#E4D08C">최신</text>
    <text x="313"  y="444" fill="#C4AE6E">한 해 전</text>
    <text x="479"  y="444" fill="#9C8B58">두 해 전</text>
    <text x="645"  y="444" fill="#7A6E48" font-size="18">?</text>
    <text x="811"  y="444" fill="#665C3D" font-size="18">?</text>
    <text x="977"  y="444" fill="#554E35" font-size="18">?</text>
  </g>
  <text x="1074" y="444" font-size="24" font-weight="800" fill="#3B4650" text-anchor="middle">···</text>

  <rect x="72" y="510" width="1056" height="60" rx="10"
        fill="#C25450" fill-opacity="0.10" stroke="#C25450" stroke-opacity="0.36" stroke-width="1.5"/>
  <text x="600" y="548" font-size="19" font-weight="700" fill="#D98B88" text-anchor="middle">어느 현장이 몇 년 전 버전인지 아무도 모른다</text>

  <text x="72" y="618" font-size="16" fill="#96A2AE">모르면 있다고 가정하는 수밖에 없고, 그 가정은 사라지지 않는다.</text>
  <text x="72" y="644" font-size="16" fill="#96A2AE">그래서 하위호환 부채는 시간이 지나도 줄지 않는다.</text>
</svg>
