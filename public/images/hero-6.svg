<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg6)"/>

  <!--
    이 시스템의 모든 어려움이 나오는 한 장이다.
    아래쪽 1,000곳이 진실의 원본이고, 위쪽 본사는 그걸 뒤늦게 받아 적는 사본이다.
    화살표가 아래에서 위로만 굵은 이유가 그것이다.
  -->

  <text x="72" y="86" font-size="34" font-weight="800" fill="#E7ECF2">1,000개 주차장을 한 곳에서 돌린다</text>
  <text x="72" y="122" font-size="18" fill="#7A8794">본사는 원본이 아니라 뒤늦게 따라오는 사본이다</text>

  <!-- 본사 -->
  <rect x="380" y="186" width="440" height="88" rx="12"
        fill="#5B7C99" fill-opacity="0.12" stroke="#5B7C99" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="600" y="222" font-size="21" font-weight="700" fill="#9DB6CC" text-anchor="middle">본사 통합 소프트웨어</text>
  <text x="600" y="250" font-size="15" fill="#6E8598" text-anchor="middle">서버 여러 대 · 데이터베이스 하나 · 사본</text>

  <!-- 상방 화살표 (굵게) -->
  <path d="M600 400 L600 286" stroke="#3FA974" stroke-width="3" stroke-opacity="0.75"/>
  <path d="M600 278 l-8 14 h16 z" fill="#3FA974" fill-opacity="0.85"/>
  <text x="618" y="332" font-size="15" font-weight="700" fill="#7BC79E">사실 미러링</text>
  <text x="618" y="356" font-size="13" fill="#5D8C74">실패하면 숫자가 조용히 틀린다</text>

  <!-- 하방 화살표 (가늘게) -->
  <path d="M470 286 L470 400" stroke="#7A8794" stroke-width="1.5" stroke-dasharray="5 5"/>
  <path d="M470 408 l-7 -13 h14 z" fill="#7A8794"/>
  <text x="300" y="332" font-size="15" font-weight="700" fill="#96A2AE" text-anchor="end">명령 · 설정</text>
  <text x="300" y="356" font-size="13" fill="#6C7883" text-anchor="end">실패하면 바로 안다</text>

  <!-- 현장들 -->
  <text x="72" y="446" font-size="15" font-weight="700" fill="#5D8C74" letter-spacing="1">주차장 1,000~1,500곳 — 진실의 원본</text>

  <g fill="#3FA974" fill-opacity="0.16" stroke="#3FA974" stroke-opacity="0.42" stroke-width="1.2">
    <rect x="72"  y="470" width="122" height="72" rx="9"/>
    <rect x="212" y="470" width="122" height="72" rx="9"/>
    <rect x="352" y="470" width="122" height="72" rx="9"/>
    <rect x="492" y="470" width="122" height="72" rx="9"/>
    <rect x="632" y="470" width="122" height="72" rx="9"/>
    <rect x="772" y="470" width="122" height="72" rx="9"/>
    <rect x="912" y="470" width="122" height="72" rx="9"/>
  </g>
  <g font-size="13" fill="#7BC79E" text-anchor="middle">
    <text x="133"  y="503">자기 DB</text><text x="133"  y="524" font-size="11" fill="#5D8C74">자립 동작</text>
    <text x="273"  y="503">자기 DB</text><text x="273"  y="524" font-size="11" fill="#5D8C74">자립 동작</text>
    <text x="413"  y="503">자기 DB</text><text x="413"  y="524" font-size="11" fill="#5D8C74">자립 동작</text>
    <text x="553"  y="503">자기 DB</text><text x="553"  y="524" font-size="11" fill="#5D8C74">자립 동작</text>
    <text x="693"  y="503">자기 DB</text><text x="693"  y="524" font-size="11" fill="#5D8C74">자립 동작</text>
    <text x="833"  y="503">자기 DB</text><text x="833"  y="524" font-size="11" fill="#5D8C74">자립 동작</text>
    <text x="973"  y="503">자기 DB</text><text x="973"  y="524" font-size="11" fill="#5D8C74">자립 동작</text>
  </g>
  <text x="1074" y="512" font-size="26" font-weight="800" fill="#3B4650" text-anchor="middle">···</text>

  <text x="72" y="600" font-size="16" fill="#96A2AE">인터넷이 끊겨도 차는 들어온다. 그래서 현장은 자립해야 하고,</text>
  <text x="72" y="626" font-size="16" fill="#96A2AE">본사는 태생적으로 뒤늦게 따라가는 쪽이 된다.</text>
</svg>
