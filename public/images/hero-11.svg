<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg11" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg11)"/>

  <!--
    폐루프를 그린 것이다.
    왼쪽 원 안에서는 저장할 때 이스케이프하고 그릴 때 되돌리니 완벽히 정상으로 보인다.
    오른쪽으로 값이 넘어가는 순간에만 깨진다. 그래서 가장 늦게 발견됐다.
  -->

  <text x="72" y="86" font-size="34" font-weight="800" fill="#E7ECF2">혼자서는 완벽하게 정상이다</text>
  <text x="72" y="122" font-size="18" fill="#7A8794">경계를 넘는 순간에만 드러나는 결함</text>

  <!-- 폐루프 -->
  <rect x="72" y="182" width="470" height="300" rx="14"
        fill="#3FA974" fill-opacity="0.07" stroke="#3FA974" stroke-opacity="0.35" stroke-width="1.6"/>
  <text x="100" y="218" font-size="16" font-weight="700" fill="#7BC79E" letter-spacing="1">현장 시스템 — 닫힌 고리</text>

  <rect x="104" y="242" width="406" height="60" rx="9" fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.34" stroke-width="1.2"/>
  <text x="128" y="278" font-size="16" fill="#7BC79E">저장할 때 따옴표를 엔티티로 바꾼다</text>

  <path d="M307 306 L307 336" stroke="#3FA974" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M307 344 l-7 -13 h14 z" fill="#3FA974" fill-opacity="0.7"/>

  <rect x="104" y="348" width="406" height="60" rx="9" fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.34" stroke-width="1.2"/>
  <text x="128" y="384" font-size="16" fill="#7BC79E">HTML로 그리니 원래 문자로 보인다</text>

  <rect x="104" y="424" width="406" height="42" rx="8" fill="#3FA974" fill-opacity="0.20"/>
  <text x="307" y="452" font-size="16" font-weight="700" fill="#9FD9BB" text-anchor="middle">여기까지는 아무 문제가 없다</text>

  <!-- 경계 -->
  <path d="M586 182 L586 482" stroke="#C25450" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="10 7"/>
  <path d="M542 332 L636 332" stroke="#7A8794" stroke-width="2"/>
  <path d="M644 332 l-14 -7 v14 z" fill="#7A8794"/>
  <text x="586" y="518" font-size="15" font-weight="700" fill="#C25450" text-anchor="middle" letter-spacing="2">경계</text>

  <!-- 바깥 -->
  <rect x="658" y="182" width="470" height="300" rx="14"
        fill="#C25450" fill-opacity="0.08" stroke="#C25450" stroke-opacity="0.38" stroke-width="1.6"/>
  <text x="686" y="218" font-size="16" font-weight="700" fill="#D98B88" letter-spacing="1">본사 · 관리자 웹</text>

  <rect x="690" y="242" width="406" height="60" rx="9" fill="#C25450" fill-opacity="0.12" stroke="#C25450" stroke-opacity="0.32" stroke-width="1.2"/>
  <text x="714" y="278" font-size="16" fill="#D98B88">이스케이프 개념이 없다</text>

  <rect x="690" y="348" width="406" height="60" rx="9" fill="#C25450" fill-opacity="0.12" stroke="#C25450" stroke-opacity="0.32" stroke-width="1.2"/>
  <text x="714" y="384" font-size="16" fill="#D98B88">텍스트 보간이라 날것으로 노출된다</text>

  <rect x="690" y="424" width="406" height="42" rx="8" fill="#C25450" fill-opacity="0.18"/>
  <text x="893" y="452" font-size="16" font-weight="700" fill="#E0A5A2" text-anchor="middle">여기서만 깨져 보인다</text>

  <text x="72" y="580" font-size="16" fill="#96A2AE">원인은 현장 설정 파일 한 줄에 있었고 증상은 다른 시스템 화면에 있었다.</text>
  <text x="72" y="612" font-size="16" font-weight="700" fill="#7BC79E">고칠 위치로 셋을 비교해서, 화면마다가 아니라 경계에서 한 번을 골랐다.</text>
  <text x="72" y="644" font-size="16" fill="#96A2AE">시스템이 여럿이면 우리 쪽은 정상이 증명이 안 된다.</text>
</svg>
