<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg13" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg13)"/>

  <!--
    락 경합을 시간축 두 줄로 옮긴 것이다.
    위 줄은 취소 트랜잭션이 행 락을 쥔 채 결제사와 통신하는 구간이고,
    아래 줄은 같은 행을 기다리다 50초 만에 죽는 입금통보다.
    노란 구간이 길어지는 만큼 아래가 죽는다는 게 이 글의 전부다.
  -->

  <text x="72" y="86" font-size="34" font-weight="800" fill="#E7ECF2">범인은 느린 쿼리가 아니었다</text>
  <text x="72" y="122" font-size="18" fill="#7A8794">누군가 DB와의 연결을 쥔 채 외부와 통신하고 있었다</text>

  <!-- 시간축 -->
  <path d="M72 180 L1128 180" stroke="#3B4650" stroke-width="1.2" stroke-opacity="0.6"/>
  <text x="72" y="170" font-size="13" fill="#6C7883">시간 →</text>

  <!-- 위: 취소 트랜잭션 -->
  <text x="72" y="238" font-size="17" font-weight="700" fill="#5B7C99" letter-spacing="1">취소 트랜잭션</text>

  <rect x="72" y="256" width="150" height="64" rx="10"
        fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.42" stroke-width="1.4"/>
  <text x="96" y="294" font-size="16" font-weight="700" fill="#7BC79E">행 락 획득</text>

  <rect x="230" y="256" width="640" height="64" rx="10"
        fill="#C9A227" fill-opacity="0.12" stroke="#C9A227" stroke-opacity="0.45" stroke-width="1.6"/>
  <text x="256" y="284" font-size="16" font-weight="700" fill="#E4D08C">결제사에 취소 요청 — 외부 HTTP 통신</text>
  <text x="256" y="308" font-size="14" fill="#B49A52">몇 초가 걸릴지 상대가 정한다. 그동안 락은 내 손에 있다</text>

  <rect x="878" y="256" width="110" height="64" rx="10"
        fill="#3B4650" fill-opacity="0.28" stroke="#4A5560" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="902" y="294" font-size="16" font-weight="700" fill="#8A96A2">커밋</text>

  <!-- 락 보유 구간 표시 -->
  <path d="M72 340 L988 340" stroke="#C25450" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M72 334 L72 346" stroke="#C25450" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M988 334 L988 346" stroke="#C25450" stroke-width="2" stroke-opacity="0.5"/>
  <text x="530" y="364" font-size="14" font-weight="700" fill="#C25450" text-anchor="middle">여기까지 전부 락 보유 구간이다</text>

  <!-- 아래: 입금통보 -->
  <text x="72" y="432" font-size="17" font-weight="700" fill="#5B7C99" letter-spacing="1">입금통보</text>

  <rect x="300" y="450" width="200" height="64" rx="10"
        fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.42" stroke-width="1.4"/>
  <text x="324" y="488" font-size="16" font-weight="700" fill="#7BC79E">같은 행 UPDATE</text>

  <path d="M508 482 L900 482" stroke="#8A96A2" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.7"/>
  <text x="700" y="470" font-size="14" fill="#8A96A2" text-anchor="middle">락 대기 50초</text>

  <text x="916" y="494" font-size="32" font-weight="800" fill="#C25450" fill-opacity="0.8">×</text>
  <text x="948" y="490" font-size="15" fill="#D98B88">Lock wait timeout</text>

  <text x="300" y="546" font-size="14" fill="#6C7883">통보가 죽으면 결제는 입금대기에 갇히고, 정기권은 생기지 않는다</text>

  <text x="72" y="614" font-size="16" fill="#96A2AE">타임아웃은 내 쿼리가 느리다는 뜻이 아니라, 누가 락을 안 놔준다는 뜻이다.</text>
  <text x="72" y="640" font-size="16" font-weight="700" fill="#7BC79E">통신을 락 밖으로 빼자 보유 시간은 통신 시간에서 밀리초가 됐다.</text>
</svg>
