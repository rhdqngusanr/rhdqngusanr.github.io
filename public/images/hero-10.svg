<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
 font-family="Pretendard, Malgun Gothic, sans-serif">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#0E1114"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg10)"/>

  <!--
    분산 트랜잭션의 본질을 한 줄로 옮긴 것이다.
    가운데 세로선이 우리 시스템과 결제사의 경계다.
    왼쪽 롤백 화살표가 경계에서 끊기는 게 이 글 전체의 논지다.
  -->

  <text x="72" y="86" font-size="34" font-weight="800" fill="#E7ECF2">경계 너머에는 롤백이 없다</text>
  <text x="72" y="122" font-size="18" fill="#7A8794">승인은 남았고 주문은 없다</text>

  <!-- 경계선 -->
  <path d="M600 176 L600 520" stroke="#C25450" stroke-width="2.5" stroke-opacity="0.55" stroke-dasharray="10 7"/>
  <text x="600" y="556" font-size="15" font-weight="700" fill="#C25450" text-anchor="middle" letter-spacing="2">경계</text>

  <!-- 우리 쪽 -->
  <text x="72" y="216" font-size="17" font-weight="700" fill="#5B7C99" letter-spacing="1">우리 시스템</text>

  <rect x="72" y="238" width="472" height="66" rx="10"
        fill="#3FA974" fill-opacity="0.14" stroke="#3FA974" stroke-opacity="0.42" stroke-width="1.4"/>
  <text x="98" y="278" font-size="18" font-weight="700" fill="#7BC79E">① 결제 요청</text>

  <rect x="72" y="322" width="472" height="66" rx="10"
        fill="#C25450" fill-opacity="0.12" stroke="#C25450" stroke-opacity="0.42" stroke-width="1.4"/>
  <text x="98" y="362" font-size="18" font-weight="700" fill="#D98B88">③ 우리 저장 실패</text>

  <rect x="72" y="406" width="472" height="66" rx="10"
        fill="#3B4650" fill-opacity="0.28" stroke="#4A5560" stroke-opacity="0.5" stroke-width="1.4"/>
  <text x="98" y="446" font-size="18" font-weight="700" fill="#8A96A2">④ 롤백 —</text>
  <text x="230" y="446" font-size="17" fill="#6C7883">되돌릴 대상이 없다</text>

  <!-- 결제사 쪽 -->
  <text x="656" y="216" font-size="17" font-weight="700" fill="#5B7C99" letter-spacing="1">결제사</text>

  <rect x="656" y="238" width="472" height="150" rx="10"
        fill="#C9A227" fill-opacity="0.12" stroke="#C9A227" stroke-opacity="0.45" stroke-width="1.6"/>
  <text x="682" y="282" font-size="18" font-weight="700" fill="#E4D08C">② 승인 성공</text>
  <text x="682" y="316" font-size="16" fill="#B49A52">고객 카드에는 이미 찍혔다</text>
  <text x="682" y="348" font-size="16" fill="#B49A52">우리 롤백이 여기까지 오지 않는다</text>

  <!-- 화살표 -->
  <path d="M544 268 L648 268" stroke="#3FA974" stroke-width="2.2" stroke-opacity="0.7"/>
  <path d="M656 268 l-14 -7 v14 z" fill="#3FA974" fill-opacity="0.8"/>

  <path d="M544 438 L586 438" stroke="#8A96A2" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="614" y="444" font-size="30" font-weight="800" fill="#C25450" fill-opacity="0.75">×</text>

  <text x="72" y="614" font-size="16" fill="#96A2AE">이건 버그가 아니라 분산 트랜잭션의 본질이다.</text>
  <text x="72" y="640" font-size="16" font-weight="700" fill="#7BC79E">코드로 막는 게 아니라 보상과 대사로 설계해야 한다. 그리고 처음부터 넣어야 한다.</text>
</svg>
